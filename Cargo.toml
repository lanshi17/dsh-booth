[package]
name = "dsh-booth"
version = "0.3.3"
edition = "2021"
description = "A terminal console for dsh-superagent: tickets, threads and the people who are waiting"
license = "GPL-3.0-only"
repository = "https://github.com/lanshi17/dsh-booth"
readme = "README.md"
keywords = ["tui", "cli", "agent", "orchestration", "dsh"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.83"

[[bin]]
name = "booth"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
sha2 = "0.10"
base64 = "0.22"
unicode-width = "0.2"
ureq = { version = "2.12", features = ["json"] }

[profile.release]
lto = true
strip = true