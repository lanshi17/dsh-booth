[package]
name = "btae-eval"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
default-run = "btae-eval"

[workspace]
resolver = "3"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", default-features = false, features = ["signal", "process", "fs"] }

[[bin]]
name = "btae-eval"
path = "src/main.rs"

[[bin]]
name = "btae-fixture-worker"
path = "src/bin/fixture_worker.rs"

[lints.rust]
unsafe_code = "forbid"

[[bin]]
name = "dsh-json-fixture"
path = "src/bin/dsh_json_fixture.rs"
