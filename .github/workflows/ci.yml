name: ci

# The repository already has one entry point for every check, `tools/gauntlet.sh`; this runs its
# quick layers (format, types, lint, tests) on every push and pull request so a change cannot
# land without them. The slower layers (coverage, mutation, supply chain, real execution) stay
# local: they need tools and a live service a hosted runner does not have.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gauntlet:
    name: quick gauntlet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # `Config::from_env` resolves the bundle the service runs from, and the tests build a
          # console with it, so the pinned submodule is part of the test fixture.
          submodules: recursive
      - name: Make sure the lint and format components exist
        run: rustup component add clippy rustfmt
      - name: Run the quick layers
        run: tools/gauntlet.sh quick
