name: forge-ci

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspaces:
    name: ${{ matrix.workspace }} / fmt, clippy, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        workspace: [btae-eval, superagent-forge]
    defaults:
      run:
        working-directory: ${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: clippy,rustfmt
      - name: Prepare Linux sandbox tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --unshare-all --ro-bind / / -- /usr/bin/true
      - name: Check Rust formatting with repository rules
        run: cargo fmt --all -- --config-path ../codex-rs/rustfmt.toml --config imports_granularity=Item --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test all targets
        run: cargo test --workspace --all-targets --locked
      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree
