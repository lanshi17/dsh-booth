[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/application",
    "crates/agent-protocol",
    "crates/agent-backend",
    "crates/agent-omp",
    "crates/agent-dsh",
    "crates/agent-runtime",
    "crates/orchestrator",
    "crates/task-scheduler",
    "crates/worktree",
    "crates/review",
    "crates/persistence",
    "crates/mcp-server",
    "crates/identity",
    "crates/config",
    "crates/cli",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
version = "0.1.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
toml = "0.9"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "process",
    "rt-multi-thread",
    "sync",
    "time",
] }
turso_core = { version = "0.9.0-pre.2", default-features = false, features = [
    "fs",
    "uuid",
    "time",
    "json",
    "series",
    "encryption",
    "percentile",
    "autovacuum",
    "pure-rust-crypto",
] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
